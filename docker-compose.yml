services:
  postgres:
    image: postgres:16
    container_name: pcms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: pcms_admin
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: pcms_es

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

